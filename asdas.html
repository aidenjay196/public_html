<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyrule Randomizer</title>
    <style>
        /* Basic Styling */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 40px; 
            background: #1a1a1a; 
            color: #ffffff;
        }
        #card { 
            background: #2a2a2a; 
            padding: 25px; 
            border-radius: 12px; 
            max-width: 450px; 
            margin: 20px auto; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            border: 2px solid #c9a227; /* Gold border */
        }
        /* Image Styling */
        #charImg { 
            width: 100%; 
            max-height: 250px; 
            object-fit: contain; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            display: none; /* Hidden until a character is loaded */
            background: #000;
        }
        button { 
            padding: 12px 24px; 
            font-size: 18px; 
            font-weight: bold;
            cursor: pointer; 
            background: #c9a227; 
            color: #1a1a1a; 
            border: none; 
            border-radius: 6px; 
            transition: transform 0.2s, background 0.2s;
        }
        button:hover { 
            background: #e6b82e; 
            transform: scale(1.05); 
        }
        h2 { color: #c9a227; margin-top: 0; text-transform: uppercase; }
        p { line-height: 1.5; font-size: 15px; color: #ccc; }
        .category-tag { font-size: 12px; color: #888; text-transform: uppercase; margin-bottom: 10px; display: block; }
    </style>
</head>
<body>

    <h1>Hyrule Compendium</h1>
    <button id="randomBtn">Summon Random Entry</button>

    <div id="card">
        <span id="category" class="category-tag">Search the Wilds</span>
        <img id="charImg" src="" alt="Character Image">
        <h2 id="charName">Ready?</h2>
        <p id="charDesc">Press the button to retrieve an entry from the Compendium.</p>
    </div>

    <script>
        const btn = document.getElementById('randomBtn');
        const nameDisplay = document.getElementById('charName');
        const descDisplay = document.getElementById('charDesc');
        const imgDisplay = document.getElementById('charImg');
        const categoryDisplay = document.getElementById('category');

        btn.addEventListener('click', async () => {
            nameDisplay.textContent = "Loading...";
            descDisplay.textContent = "Consulting the Sheikah Slate...";
            imgDisplay.style.display = 'none';

            try {
                const response = await fetch('https://botw-compendium.herokuapp.com');
                const result = await response.json();
                const allEntries = result.data;


                const categories = Object.values(allEntries).flat();
                const randomEntry = categories[Math.floor(Math.random() * categories.length)];

                categoryDisplay.textContent = randomEntry.category;
                nameDisplay.textContent = randomEntry.name.charAt(0).toUpperCase() + randomEntry.name.slice(1);
                descDisplay.textContent = randomEntry.description;
                
                imgDisplay.src = randomEntry.image;
                imgDisplay.style.display = 'block';

            } catch (error) {
                console.error("Fetch Error:", error);
                nameDisplay.textContent = "Error!";
                descDisplay.textContent = "Could not connect to the Compendium. Check your internet connection.";
            }
        });
    </script>

</body>
</html>
